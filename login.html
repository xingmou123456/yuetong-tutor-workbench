<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 · 月瞳家教工作台</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .login-page::before {
      content: "";
      position: fixed;
      top: -30%;
      right: -20%;
      width: 80vw;
      height: 80vw;
      background: radial-gradient(circle, rgba(232, 168, 124, 0.18) 0%, transparent 55%);
      pointer-events: none;
    }
    .login-page::after {
      content: "";
      position: fixed;
      bottom: -20%;
      left: -15%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(217, 119, 87, 0.12) 0%, transparent 50%);
      pointer-events: none;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      position: relative;
      z-index: 1;
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .login-brand-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .login-brand-text { text-align: left; }
    .login-brand-title { font-size: 22px; font-weight: 700; color: var(--text); }
    .login-brand-subtitle { font-size: 13px; color: var(--text-muted); }
    .login-title { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 8px; }
    .login-desc { font-size: 14px; color: var(--text-sub); text-align: center; margin-bottom: 28px; }
    .login-hint {
      margin-top: 24px;
      padding: 14px;
      background: var(--surface-elevated);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.7;
    }
    .login-hint strong { color: var(--text); }
    @media (max-width: 480px) {
      .login-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card animate-fade-up">
      <div class="login-brand">
        <div class="login-brand-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 14.83 4.24 4.24"/></svg>
        </div>
        <div class="login-brand-text">
          <div class="login-brand-title">月瞳家教</div>
          <div class="login-brand-subtitle">AI 家教工作台</div>
        </div>
      </div>

      <h1 class="login-title">欢迎回来</h1>
      <p class="login-desc">登录后开始管理学生、备课与生成学习报告</p>

      <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-account">账号</label>
          <input type="text" id="login-account" class="input" placeholder="请输入账号">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">密码</label>
          <input type="password" id="login-password" class="input" placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top: 8px;">登录</button>
      </form>

      <div class="login-hint">
        <strong>原型提示：</strong>当前为前端演示，未接入真实账号系统，任意账号密码均可进入体验。正式版需后端支持，建议微信小程序接入微信一键登录。
      </div>
    </div>
  </div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      localStorage.setItem('yuetong_logged_in', '1');
      localStorage.removeItem('yuetong_seen_disclaimer');
      window.location.href = 'index.html';
      return false;
    }
  </script>
</body>
</html>
