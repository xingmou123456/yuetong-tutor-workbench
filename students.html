<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>学生档案 · 月瞳家教工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="students">
  <!-- App Shell: Sidebar -->
  <aside class="app-nav">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 14.83 4.24 4.24"/></svg>
      </div>
      <div>
        <div class="brand-title">月瞳家教</div>
        <div class="brand-subtitle">AI 家教工作台</div>
      </div>
    </div>
    <nav class="nav-list" aria-label="主导航">
      <a href="index.html" data-nav="dashboard"><span class="nav-icon" data-icon="layout-dashboard"></span>工作台</a>
      <a href="students.html" data-nav="students"><span class="nav-icon" data-icon="users"></span>学生档案</a>
      <a href="lesson-plan.html" data-nav="lesson-plan"><span class="nav-icon" data-icon="book-open"></span>教案生成</a>
      <a href="homework.html" data-nav="homework"><span class="nav-icon" data-icon="file-text"></span>作业生成</a>
      <a href="report.html" data-nav="report"><span class="nav-icon" data-icon="trending-up"></span>学习报告</a>
    </nav>
    <div class="nav-footer">MVP v1.0 · 离线原型</div>
  </aside>

  <!-- App Shell: Bottom Nav (mobile) -->
  <nav class="bottom-nav" aria-label="底部导航">
    <div class="bottom-nav-inner">
      <a href="index.html" data-nav="dashboard"><span data-icon="layout-dashboard"></span>工作台</a>
      <a href="students.html" data-nav="students"><span data-icon="users"></span>学生</a>
      <a href="lesson-plan.html" data-nav="lesson-plan"><span data-icon="book-open"></span>教案</a>
      <a href="homework.html" data-nav="homework"><span data-icon="file-text"></span>作业</a>
      <a href="report.html" data-nav="report"><span data-icon="trending-up"></span>报告</a>
    </div>
  </nav>

  <main class="app-content">
    <div class="container">
      <header class="page-header animate-fade-up">
        <div>
          <h1 class="page-title">学生档案</h1>
          <p class="page-desc">管理学生画像与课后反馈，AI 将基于档案生成更贴合的教案。</p>
        </div>
        <button class="btn btn-primary" onclick="openStudentDrawer()"><span data-icon="plus"></span>添加学生</button>
      </header>

      <section class="card animate-fade-up stagger-1 mb-24" style="padding: 12px 16px;">
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
          <span data-icon="search" style="color: var(--text-muted);"></span>
          <input type="text" id="search-input" class="input" placeholder="搜索姓名、年级或科目" style="flex: 1; min-width: 200px; border: none; background: transparent; padding-left: 0;">
        </div>
      </section>

      <section id="students-grid" class="animate-fade-up stagger-2" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        <!-- Cards injected via JS -->
      </section>

      <section class="empty-state hidden" id="empty-state">
        <div class="empty-icon" data-icon="users"></div>
        <div class="empty-title">还没有学生</div>
        <div class="empty-desc">点击右上角添加第一位学生，开始建立档案。</div>
        <button class="btn btn-primary" onclick="openStudentDrawer()">添加学生</button>
      </section>
    </div>
  </main>

  <!-- Student Drawer -->
  <div class="drawer" id="student-drawer">
    <div class="drawer-header">
      <h2 class="modal-title" id="drawer-title">添加学生</h2>
      <button class="close-btn" onclick="YTDrawer.close('#student-drawer')" aria-label="关闭"><span data-icon="x"></span></button>
    </div>
    <div class="drawer-body">
      <form id="student-form">
        <input type="hidden" id="student-id">
        <div class="form-group">
          <label class="form-label" for="stu-name">姓名</label>
          <input type="text" id="stu-name" class="input" placeholder="例如：林小满" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="stu-grade">年级</label>
            <select id="stu-grade" class="select" required>
              <option value="">请选择</option>
              <option value="小学一年级">小学一年级</option>
              <option value="小学二年级">小学二年级</option>
              <option value="小学三年级">小学三年级</option>
              <option value="小学四年级">小学四年级</option>
              <option value="小学五年级">小学五年级</option>
              <option value="小学六年级">小学六年级</option>
              <option value="初一">初一</option>
              <option value="初二">初二</option>
              <option value="初三">初三</option>
              <option value="高一">高一</option>
              <option value="高二">高二</option>
              <option value="高三">高三</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="stu-subject">科目</label>
            <select id="stu-subject" class="select" required>
              <option value="">请选择</option>
              <option value="语文">语文</option>
              <option value="数学">数学</option>
              <option value="英语">英语</option>
              <option value="物理">物理</option>
              <option value="化学">化学</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="stu-weak">薄弱项</label>
          <textarea id="stu-weak" class="textarea" rows="2" placeholder="例如：一元一次方程应用题、几何证明入门"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="stu-habits">学习习惯</label>
          <textarea id="stu-habits" class="textarea" rows="2" placeholder="例如：喜欢先自己思考，遇到卡壳会沉默较长时间"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="stu-personality">性格特点</label>
          <textarea id="stu-personality" class="textarea" rows="2" placeholder="例如：内向但认真，鼓励后更愿意开口"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="stu-expectation">家长期望</label>
          <textarea id="stu-expectation" class="textarea" rows="2" placeholder="例如：希望培养解题思路，期中考试能上80分"></textarea>
        </div>
      </form>

      <div id="feedback-section" class="hidden mt-24">
        <h3 class="section-title"><span data-icon="message-circle"></span>课后反馈</h3>
        <div id="feedback-timeline" style="border-left: 2px solid var(--divider); padding-left: 16px; margin-bottom: 20px;"></div>
        <div class="card" style="background: var(--surface-elevated);">
          <div class="card-body">
            <div class="form-group">
              <label class="form-label" for="fb-content">新增反馈</label>
              <textarea id="fb-content" class="textarea" rows="3" placeholder="记录今日课堂表现、掌握情况、存在的问题..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="fb-goals">下一步目标</label>
              <input type="text" id="fb-goals" class="input" placeholder="例如：完成5道变式练习">
            </div>
            <button type="button" class="btn btn-secondary" onclick="submitFeedback()">记录反馈</button>
          </div>
        </div>
      </div>
    </div>
    <div class="drawer-footer">
      <button type="button" class="btn btn-ghost" onclick="YTDrawer.close('#student-drawer')">取消</button>
      <button type="button" class="btn btn-primary" onclick="saveStudent()">保存</button>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">确认删除</h2>
        <button class="close-btn" onclick="YTModal.close('#delete-modal')" aria-label="关闭"><span data-icon="x"></span></button>
      </div>
      <div class="modal-body">
        <p class="text-sub">删除后，该学生档案、反馈记录将无法恢复。是否继续？</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="YTModal.close('#delete-modal')">取消</button>
        <button class="btn btn-danger" id="confirm-delete-btn">删除</button>
      </div>
    </div>
  </div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      // Render icons
      document.querySelectorAll('[data-icon]').forEach((el) => {
        const name = el.dataset.icon;
        const svg = window.YTIcon(name);
        if (svg) el.innerHTML = svg;
      });

      let deleteTargetId = null;
      let currentStudentId = null;

      function renderStudents(filter = "") {
        const grid = document.getElementById('students-grid');
        const empty = document.getElementById('empty-state');
        const students = window.YTData.DB.students.filter((s) =>
          s.name.includes(filter) || s.grade.includes(filter) || s.subject.includes(filter)
        );

        if (!students.length) {
          grid.innerHTML = '';
          empty.classList.remove('hidden');
          return;
        }
        empty.classList.add('hidden');

        grid.innerHTML = students.map((s) => `
          <div class="card card-hover" style="display: flex; flex-direction: column;">
            <div class="card-body" style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                  <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;">${s.name.slice(0, 1)}</div>
                  <div>
                    <div class="font-semibold" style="font-size: 16px;">${s.name}</div>
                    <div class="text-sub" style="font-size: 12px;">${s.grade} · ${s.subject}</div>
                  </div>
                </div>
                <span class="tag tag-primary">${s.feedbacks.length} 条反馈</span>
              </div>
              <div style="margin-bottom: 10px;">
                <div class="text-muted" style="font-size: 12px; margin-bottom: 4px;">薄弱项</div>
                <div style="font-size: 13px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${s.weakPoints || '暂无'}</div>
              </div>
              <div>
                <div class="text-muted" style="font-size: 12px; margin-bottom: 4px;">家长期望</div>
                <div style="font-size: 13px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${s.parentExpectation || '暂无'}</div>
              </div>
            </div>
            <div style="padding: 12px 20px; border-top: 1px solid var(--divider); display: flex; gap: 8px;">
              <button class="btn btn-ghost btn-sm" style="flex: 1;" onclick="editStudent('${s.id}')">编辑</button>
              <button class="btn btn-secondary btn-sm" style="flex: 1;" onclick="editStudent('${s.id}', true)">反馈</button>
              <button class="btn btn-danger btn-sm" onclick="confirmDelete('${s.id}')">删除</button>
            </div>
          </div>
        `).join('');
      }

      window.openStudentDrawer = function () {
        currentStudentId = null;
        document.getElementById('drawer-title').textContent = '添加学生';
        document.getElementById('student-form').reset();
        document.getElementById('student-id').value = '';
        document.getElementById('feedback-section').classList.add('hidden');
        window.YTDrawer.open('#student-drawer');
      };

      window.editStudent = function (id, focusFeedback = false) {
        const s = window.YTData.DB.students.find((x) => x.id === id);
        if (!s) return;
        currentStudentId = id;
        document.getElementById('drawer-title').textContent = '编辑学生';
        document.getElementById('student-id').value = s.id;
        document.getElementById('stu-name').value = s.name;
        document.getElementById('stu-grade').value = s.grade;
        document.getElementById('stu-subject').value = s.subject;
        document.getElementById('stu-weak').value = s.weakPoints || '';
        document.getElementById('stu-habits').value = s.habits || '';
        document.getElementById('stu-personality').value = s.personality || '';
        document.getElementById('stu-expectation').value = s.parentExpectation || '';
        renderFeedbackTimeline(s);
        document.getElementById('feedback-section').classList.remove('hidden');
        window.YTDrawer.open('#student-drawer');
        if (focusFeedback) {
          setTimeout(() => document.getElementById('fb-content').focus(), 100);
        }
      };

      function renderFeedbackTimeline(s) {
        const container = document.getElementById('feedback-timeline');
        if (!s.feedbacks.length) {
          container.innerHTML = '<div class="text-muted" style="font-size: 13px;">暂无反馈记录</div>';
          return;
        }
        container.innerHTML = s.feedbacks.map((f) => `
          <div style="position: relative; margin-bottom: 16px;">
            <div style="position: absolute; left: -21px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface);"></div>
            <div class="font-medium" style="font-size: 13px; margin-bottom: 4px;">${f.date}</div>
            <div style="font-size: 13px; color: var(--text); margin-bottom: 4px;">${f.content}</div>
            <div style="font-size: 12px; color: var(--text-sub);">下一步：${f.nextGoals}</div>
          </div>
        `).join('');
      }

      window.saveStudent = async function () {
        const name = document.getElementById('stu-name').value.trim();
        const grade = document.getElementById('stu-grade').value;
        const subject = document.getElementById('stu-subject').value;
        if (!name || !grade || !subject) {
          window.YTToast('请填写姓名、年级和科目', 'error');
          return;
        }
        const payload = {
          name,
          grade,
          subject,
          weakPoints: document.getElementById('stu-weak').value.trim(),
          habits: document.getElementById('stu-habits').value.trim(),
          personality: document.getElementById('stu-personality').value.trim(),
          parentExpectation: document.getElementById('stu-expectation').value.trim()
        };
        if (currentStudentId) {
          await window.YTApi.updateStudent(currentStudentId, payload);
          window.YTToast('学生信息已更新');
        } else {
          await window.YTApi.createStudent(payload);
          window.YTToast('学生已添加');
        }
        window.YTDrawer.close('#student-drawer');
        renderStudents(document.getElementById('search-input').value);
      };

      window.confirmDelete = function (id) {
        deleteTargetId = id;
        window.YTModal.open('#delete-modal');
      };

      document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
        if (!deleteTargetId) return;
        await window.YTApi.deleteStudent(deleteTargetId);
        window.YTModal.close('#delete-modal');
        window.YTToast('学生已删除');
        renderStudents(document.getElementById('search-input').value);
        deleteTargetId = null;
      });

      window.submitFeedback = async function () {
        const content = document.getElementById('fb-content').value.trim();
        if (!content) {
          window.YTToast('请填写反馈内容', 'error');
          return;
        }
        await window.YTApi.addFeedback(currentStudentId, {
          content,
          nextGoals: document.getElementById('fb-goals').value.trim() || '继续巩固本周内容'
        });
        document.getElementById('fb-content').value = '';
        document.getElementById('fb-goals').value = '';
        const s = window.YTData.DB.students.find((x) => x.id === currentStudentId);
        renderFeedbackTimeline(s);
        window.YTToast('反馈已记录');
        renderStudents(document.getElementById('search-input').value);
      };

      document.getElementById('search-input').addEventListener('input', (e) => {
        renderStudents(e.target.value);
      });

      renderStudents();
    })();
  </script>
</body>
</html>
